<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="526" viewBox="0 0 1120 526" role="img" aria-labelledby="title desc">
  <title id="title">DshanPI USBToolBox 与 DshanMCU-F407 SWD 接线图</title>
  <desc id="desc">DshanPI USBToolBox 2×10 扩展口的 P13(GPIO4/IO4/SWCLK)、P18(GPIO7/IO7/SWDIO)、P19/P20(GND) 分别对应连接 DShanMCU-F407 核心板白色 4-Pin SWD 接口的 CLK(PA14)、DIO(PA13)、GND。</desc>
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5faff"/>
      <stop offset="55%" stop-color="#fbfdff"/>
      <stop offset="100%" stop-color="#f4f8fc"/>
    </linearGradient>
    <pattern id="bp-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1769aa" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="card-shadow" x="-6%" y="-6%" width="112%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f2942" flood-opacity="0.07"/>
    </filter>
    <filter id="pill-shadow" x="-15%" y="-25%" width="130%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f2942" flood-opacity="0.08"/>
    </filter>
    <clipPath id="clip-left">
      <rect x="44" y="124" width="366" height="306" rx="14"/>
    </clipPath>
    <clipPath id="clip-right">
      <rect x="710" y="124" width="366" height="306" rx="14"/>
    </clipPath>
    <style>
      .eyebrow { font: 700 12px "JetBrains Mono", Consolas, "Microsoft YaHei", monospace; fill: #1769aa; letter-spacing: 0.8px; }
      .title { font: 700 24px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f2942; }
      .subtitle { font: 500 13.5px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .badge-l { font: 700 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0369a1; }
      .badge-r { font: 700 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f766e; }
      .micro { font: 600 12px "JetBrains Mono", Consolas, "Microsoft YaHei", monospace; fill: #64748b; }
      .card-title { font: 700 18px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f2942; }
      .pin { font: 700 13px "JetBrains Mono", Consolas, monospace; fill: #1e293b; }
      .sig { font: 700 15px "JetBrains Mono", Inter, "Microsoft YaHei", monospace; fill: #0f2942; }
      .alias { font: 500 12.5px "JetBrains Mono", Consolas, "Microsoft YaHei", monospace; fill: #64748b; }
      .role { font: 500 12.5px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .wire-lbl { font: 700 13px "JetBrains Mono", Consolas, monospace; }
      .note-tag { font: 700 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0369a1; }
      .note-txt { font: 500 13px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #334155; }
    </style>
  </defs>

  <!-- Canvas & blueprint grid -->
  <rect width="1120" height="526" fill="url(#bg-grad)"/>
  <rect width="1120" height="526" fill="url(#bp-grid)"/>

  <!-- Top Header -->
  <g>
    <rect x="44" y="24" width="236" height="24" rx="12" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1"/>
    <circle cx="59" cy="36" r="3.5" fill="#0284c7"/>
    <text x="71" y="40" class="eyebrow">3-WIRE SWD · 3.3V LOGIC</text>
    <text x="44" y="76" class="title">DshanPI USBToolBox 与 DshanMCU-F407 SWD 接线图</text>
    <text x="44" y="99" class="subtitle">先按信号名核对调试器 2×10 扩展口引脚，再与核心板白色 4-Pin SWD 接口同名连接</text>
    <text x="1076" y="76" text-anchor="end" class="micro">NO NRST · SYSRESETREQ</text>
  </g>

  <!-- Left Hardware Module Card: USBToolBox 2x10 Header -->
  <g filter="url(#card-shadow)">
    <rect x="44" y="124" width="366" height="306" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.25"/>
  </g>
  <g clip-path="url(#clip-left)">
    <rect x="44" y="124" width="366" height="4" fill="#1769aa"/>
  </g>
  <rect x="64" y="142" width="66" height="22" rx="11" fill="#e0f2fe"/>
  <text x="97" y="157" text-anchor="middle" class="badge-l">调试器端</text>
  <text x="390" y="157" text-anchor="end" class="micro">2×10 扩展口</text>
  <text x="64" y="187" class="card-title">DshanPI USBToolBox</text>
  <line x1="64" y1="202" x2="390" y2="202" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Left Pin Rows (y centers: 240, 306, 372) -->
  <g>
    <rect x="62" y="218" width="328" height="44" rx="9" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="70" y="227" width="84" height="26" rx="6" fill="#e0f2fe"/>
    <text x="112" y="245" text-anchor="middle" class="pin">P13</text>
    <text x="166" y="245" class="sig">SWCLK</text>
    <text x="378" y="244" text-anchor="end" class="alias">GPIO4 / IO4 / TCK</text>

    <rect x="62" y="284" width="328" height="44" rx="9" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="70" y="293" width="84" height="26" rx="6" fill="#ccfbf1"/>
    <text x="112" y="311" text-anchor="middle" class="pin">P18</text>
    <text x="166" y="311" class="sig">SWDIO</text>
    <text x="378" y="310" text-anchor="end" class="alias">GPIO7 / IO7 / TMS</text>

    <rect x="62" y="350" width="328" height="44" rx="9" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="70" y="359" width="84" height="26" rx="6" fill="#e2e8f0"/>
    <text x="112" y="377" text-anchor="middle" class="pin">P19/P20</text>
    <text x="166" y="377" class="sig">GND</text>
    <text x="378" y="376" text-anchor="end" class="role">共地参考</text>
  </g>

  <!-- Right Hardware Module Card: DShanMCU-F407 SWD Header -->
  <g filter="url(#card-shadow)">
    <rect x="710" y="124" width="366" height="306" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.25"/>
  </g>
  <g clip-path="url(#clip-right)">
    <rect x="710" y="124" width="366" height="4" fill="#0d9488"/>
  </g>
  <rect x="730" y="142" width="66" height="22" rx="11" fill="#ccfbf1"/>
  <text x="763" y="157" text-anchor="middle" class="badge-r">目标板端</text>
  <text x="1056" y="157" text-anchor="end" class="micro">4-Pin 白色 SWD 接口</text>
  <text x="730" y="187" class="card-title">DshanMCU-F407 核心板</text>
  <line x1="730" y1="202" x2="1056" y2="202" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Right Pin Rows (y centers: 240, 306, 372) -->
  <g>
    <rect x="728" y="218" width="328" height="44" rx="9" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="736" y="227" width="64" height="26" rx="6" fill="#e0f2fe"/>
    <text x="768" y="245" text-anchor="middle" class="pin">CLK</text>
    <text x="812" y="245" class="sig">SWCLK</text>
    <text x="1044" y="244" text-anchor="end" class="role">PA14 · 调试时钟</text>

    <rect x="728" y="284" width="328" height="44" rx="9" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="736" y="293" width="64" height="26" rx="6" fill="#ccfbf1"/>
    <text x="768" y="311" text-anchor="middle" class="pin">DIO</text>
    <text x="812" y="311" class="sig">SWDIO</text>
    <text x="1044" y="310" text-anchor="end" class="role">PA13 · 双向数据</text>

    <rect x="728" y="350" width="328" height="44" rx="9" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="736" y="359" width="64" height="26" rx="6" fill="#e2e8f0"/>
    <text x="768" y="377" text-anchor="middle" class="pin">GND</text>
    <text x="812" y="377" class="sig">GND</text>
    <text x="1044" y="376" text-anchor="end" class="role">共地参考</text>
  </g>

  <!-- Signal Traces & Directional Arrows + Center Badges -->
  <!-- 1. SWCLK (Left -> Right, #0284c7) -->
  <g>
    <line x1="416" y1="240" x2="695" y2="240" stroke="#0284c7" stroke-width="2.75" stroke-linecap="round"/>
    <polygon points="702,240 691,234.5 691,245.5" fill="#0284c7"/>
    <circle cx="410" cy="240" r="6" fill="#ffffff" stroke="#0284c7" stroke-width="2.5"/>
    <circle cx="410" cy="240" r="2" fill="#0284c7"/>
    <circle cx="710" cy="240" r="6" fill="#ffffff" stroke="#0284c7" stroke-width="2.5"/>
    <circle cx="710" cy="240" r="2" fill="#0284c7"/>
    <g filter="url(#pill-shadow)">
      <rect x="502" y="225" width="116" height="30" rx="15" fill="#ffffff" stroke="#7dd3fc" stroke-width="1.5"/>
    </g>
    <circle cx="520" cy="240" r="3.5" fill="#0284c7"/>
    <text x="568" y="244.5" text-anchor="middle" class="wire-lbl" fill="#0369a1">SWCLK →</text>
  </g>

  <!-- 2. SWDIO (Bidirectional, #0d9488) -->
  <g>
    <line x1="425" y1="306" x2="695" y2="306" stroke="#0d9488" stroke-width="2.75" stroke-linecap="round"/>
    <polygon points="418,306 429,300.5 429,311.5" fill="#0d9488"/>
    <polygon points="702,306 691,300.5 691,311.5" fill="#0d9488"/>
    <circle cx="410" cy="306" r="6" fill="#ffffff" stroke="#0d9488" stroke-width="2.5"/>
    <circle cx="410" cy="306" r="2" fill="#0d9488"/>
    <circle cx="710" cy="306" r="6" fill="#ffffff" stroke="#0d9488" stroke-width="2.5"/>
    <circle cx="710" cy="306" r="2" fill="#0d9488"/>
    <g filter="url(#pill-shadow)">
      <rect x="497" y="291" width="126" height="30" rx="15" fill="#ffffff" stroke="#5eead4" stroke-width="1.5"/>
    </g>
    <text x="560" y="310.5" text-anchor="middle" class="wire-lbl" fill="#0f766e">← SWDIO →</text>
  </g>

  <!-- 3. GND (Common Ground, #475569) -->
  <g>
    <line x1="416" y1="372" x2="704" y2="372" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
    <circle cx="410" cy="372" r="6" fill="#ffffff" stroke="#475569" stroke-width="2.5"/>
    <circle cx="410" cy="372" r="2" fill="#475569"/>
    <circle cx="710" cy="372" r="6" fill="#ffffff" stroke="#475569" stroke-width="2.5"/>
    <circle cx="710" cy="372" r="2" fill="#475569"/>
    <g filter="url(#pill-shadow)">
      <rect x="506" y="357" width="108" height="30" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    </g>
    <circle cx="526" cy="372" r="3.5" fill="#475569"/>
    <text x="566" y="376.5" text-anchor="middle" class="wire-lbl" fill="#334155">GND</text>
  </g>

  <!-- Bottom Technical Note Bar -->
  <g>
    <rect x="44" y="452" width="1032" height="50" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="58" y="465" width="68" height="24" rx="6" fill="#e0f2fe"/>
    <text x="92" y="481.5" text-anchor="middle" class="note-tag">供电提示</text>
    <text x="138" y="482" class="note-txt">核心板白色 SWD 座子（USB OTG → DEBUG 侧）丝印为 3.3V · CLK · DIO · GND；接 DEBUG Type-C 供电时只连三线，切勿并接 3.3V / 5V 电源。</text>
  </g>
</svg>
