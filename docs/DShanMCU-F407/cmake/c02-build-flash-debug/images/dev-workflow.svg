<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="404" viewBox="0 0 1120 404" role="img" aria-labelledby="title desc">
  <title id="title">编译、烧录与调试完整流程</title>
  <desc id="desc">展示从 f407 build 编译生成固件、f407 flash SWD 下载、f407 monitor 串口查看日志到 VS Code F5 硬件单步调试的四步开发循环。</desc>
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5faff"/>
      <stop offset="55%" stop-color="#fbfdff"/>
      <stop offset="100%" stop-color="#f4f8fc"/>
    </linearGradient>
    <pattern id="bp-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1769aa" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="card-shadow" x="-6%" y="-6%" width="112%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f2942" flood-opacity="0.07"/>
    </filter>
    <clipPath id="c1"><rect x="44" y="124" width="232" height="202" rx="14"/></clipPath>
    <clipPath id="c2"><rect x="310" y="124" width="232" height="202" rx="14"/></clipPath>
    <clipPath id="c3"><rect x="576" y="124" width="232" height="202" rx="14"/></clipPath>
    <clipPath id="c4"><rect x="842" y="124" width="234" height="202" rx="14"/></clipPath>
    <style>
      .eyebrow { font: 700 12px "JetBrains Mono", Consolas, monospace; fill: #1769aa; letter-spacing: 0.7px; }
      .title { font: 700 22px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f2942; }
      .subtitle { font: 500 13.5px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .badge { font: 700 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; }
      .cmd { font: 700 12.5px "JetBrains Mono", Consolas, monospace; fill: #0f2942; }
      .body { font: 500 13px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .note-tag { font: 700 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #b45309; }
      .note-txt { font: 500 13px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect width="1120" height="404" fill="url(#bg-grad)"/>
  <rect width="1120" height="404" fill="url(#bp-grid)"/>

  <g>
    <rect x="44" y="24" width="268" height="24" rx="12" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1"/>
    <circle cx="59" cy="36" r="3.5" fill="#0284c7"/>
    <text x="71" y="40" class="eyebrow">BUILD · FLASH · MONITOR · DEBUG</text>
    <text x="44" y="75" class="title">编译、烧录与调试工作流</text>
    <text x="44" y="98" class="subtitle">所有常用操作均可在 PowerShell 命令行或 VS Code 菜单中一键完成</text>
  </g>

  <g filter="url(#card-shadow)"><rect x="44" y="124" width="232" height="202" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.25"/></g>
  <g clip-path="url(#c1)"><rect x="44" y="124" width="232" height="4" fill="#1769aa"/></g>
  <rect x="62" y="144" width="92" height="24" rx="12" fill="#e0f2fe"/>
  <text x="108" y="160" text-anchor="middle" class="badge" fill="#0369a1">1. 编译代码</text>
  <rect x="62" y="182" width="196" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="160" y="205" text-anchor="middle" class="cmd">f407 build f407_demo</text>
  <text x="62" y="246" class="body">生成 .elf、.hex 与 .bin</text>
  <text x="62" y="271" class="body">自动生成代码跳转索引</text>
  <text x="62" y="296" class="body">支持 --all 编译全部应用</text>

  <line x1="281" y1="225" x2="300" y2="225" stroke="#1769aa" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="306,225 297,220 297,230" fill="#1769aa"/>

  <g filter="url(#card-shadow)"><rect x="310" y="124" width="232" height="202" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.25"/></g>
  <g clip-path="url(#c2)"><rect x="310" y="124" width="232" height="4" fill="#0d9488"/></g>
  <rect x="328" y="144" width="92" height="24" rx="12" fill="#ccfbf1"/>
  <text x="374" y="160" text-anchor="middle" class="badge" fill="#0f766e">2. SWD 烧录</text>
  <rect x="328" y="182" width="196" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="426" y="205" text-anchor="middle" class="cmd">f407 flash f407_demo</text>
  <text x="328" y="246" class="body">默认使用 USBToolBox</text>
  <text x="328" y="271" class="body">-r stlink / dap 切换下载器</text>
  <text x="328" y="296" class="body">烧录校验后自动重启芯片</text>

  <line x1="547" y1="225" x2="566" y2="225" stroke="#0d9488" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="572,225 563,220 563,230" fill="#0d9488"/>

  <g filter="url(#card-shadow)"><rect x="576" y="124" width="232" height="202" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.25"/></g>
  <g clip-path="url(#c3)"><rect x="576" y="124" width="232" height="4" fill="#0284c7"/></g>
  <rect x="594" y="144" width="92" height="24" rx="12" fill="#e0f2fe"/>
  <text x="640" y="160" text-anchor="middle" class="badge" fill="#0369a1">3. 串口日志</text>
  <rect x="594" y="182" width="196" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="692" y="205" text-anchor="middle" class="cmd">f407 monitor COM14</text>
  <text x="594" y="246" class="body">USB 线接核心板 DEBUG 口</text>
  <text x="594" y="271" class="body">默认波特率 115200 8-N-1</text>
  <text x="594" y="296" class="body">按 Ctrl+] 退出串口监视</text>

  <line x1="813" y1="225" x2="832" y2="225" stroke="#0284c7" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="838,225 829,220 829,230" fill="#0284c7"/>

  <g filter="url(#card-shadow)"><rect x="842" y="124" width="234" height="202" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.25"/></g>
  <g clip-path="url(#c4)"><rect x="842" y="124" width="234" height="4" fill="#4f46e5"/></g>
  <rect x="860" y="144" width="92" height="24" rx="12" fill="#e0e7ff"/>
  <text x="906" y="160" text-anchor="middle" class="badge" fill="#4338ca">4. 断点调试</text>
  <rect x="860" y="182" width="198" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="959" y="205" text-anchor="middle" class="cmd">VS Code 按 F5 启动</text>
  <text x="860" y="246" class="body">基于 Cortex-Debug 调试</text>
  <text x="860" y="271" class="body">默认自动停在 main() 入口</text>
  <text x="860" y="296" class="body">可查看多任务栈与变量</text>

  <g>
    <rect x="44" y="344" width="1032" height="44" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <rect x="58" y="354" width="68" height="24" rx="6" fill="#fef3c7"/>
    <text x="92" y="370.5" text-anchor="middle" class="note-tag">占用提示</text>
    <text x="138" y="371" class="note-txt">执行 f407 flash 或 VS Code 按 F5 调试前，请先关闭 USBToolBox 桌面软件，避免占住同一条 SWD 接口。</text>
  </g>
</svg>
