<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="386" viewBox="0 0 1120 386" role="img" aria-labelledby="title desc">
  <title id="title">内置隔离工具链运行方式</title>
  <desc id="desc">通过 .venv\Scripts\f407.exe 自动定位工程根目录并调用 sdk 目录内随包自带的 Python、CMake、Ninja、Arm GCC 与 OpenOCD 工具链。</desc>
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5faff"/>
      <stop offset="55%" stop-color="#fbfdff"/>
      <stop offset="100%" stop-color="#f4f8fc"/>
    </linearGradient>
    <pattern id="bp-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1769aa" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="card-shadow" x="-6%" y="-6%" width="112%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f2942" flood-opacity="0.07"/>
    </filter>
    <clipPath id="clip-1"><rect x="44" y="124" width="310" height="188" rx="14"/></clipPath>
    <clipPath id="clip-2"><rect x="405" y="124" width="310" height="188" rx="14"/></clipPath>
    <clipPath id="clip-3"><rect x="766" y="124" width="310" height="188" rx="14"/></clipPath>
    <style>
      .eyebrow { font: 700 12px "JetBrains Mono", Consolas, "Microsoft YaHei", monospace; fill: #1769aa; letter-spacing: 0.7px; }
      .title { font: 700 22px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f2942; }
      .subtitle { font: 500 13.5px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .badge-b { font: 700 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0369a1; }
      .badge-t { font: 700 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f766e; }
      .badge-i { font: 700 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #4338ca; }
      .card-title { font: 700 16.5px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f2942; }
      .body { font: 500 13px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .mono { font: 700 13px "JetBrains Mono", Consolas, monospace; fill: #0f2942; }
      .chip { font: 700 12.5px "JetBrains Mono", Inter, "Microsoft YaHei", monospace; fill: #1e293b; }
      .note-tag { font: 700 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0369a1; }
      .note-txt { font: 500 13px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect width="1120" height="386" fill="url(#bg-grad)"/>
  <rect width="1120" height="386" fill="url(#bp-grid)"/>

  <g>
    <rect x="44" y="24" width="292" height="24" rx="12" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1"/>
    <circle cx="59" cy="36" r="3.5" fill="#0284c7"/>
    <text x="71" y="40" class="eyebrow">PORTABLE WORKSPACE · ZERO INSTALL</text>
    <text x="44" y="75" class="title">内置隔离工具链运行方式</text>
    <text x="44" y="98" class="subtitle">不改动系统 PATH、无需手动安装开发软件，整个工程文件夹移动到哪里都能直接编译烧录</text>
  </g>

  <g filter="url(#card-shadow)">
    <rect x="44" y="124" width="310" height="188" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.25"/>
  </g>
  <g clip-path="url(#clip-1)"><rect x="44" y="124" width="310" height="4" fill="#1769aa"/></g>
  <rect x="64" y="144" width="84" height="24" rx="12" fill="#e0f2fe"/>
  <text x="106" y="160" text-anchor="middle" class="badge-b">01 输入命令</text>
  <text x="160" y="161" class="card-title">从工程入口执行</text>
  <rect x="64" y="186" width="270" height="38" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="199" y="210" text-anchor="middle" class="mono">.\.venv\Scripts\f407.exe</text>
  <text x="64" y="252" class="body">常用指令：doctor / list / build / flash</text>
  <text x="64" y="278" class="body">无需配置任何 Windows 系统环境变量</text>

  <line x1="360" y1="218" x2="392" y2="218" stroke="#1769aa" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="400,218 389,212 389,224" fill="#1769aa"/>

  <g filter="url(#card-shadow)">
    <rect x="405" y="124" width="310" height="188" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.25"/>
  </g>
  <g clip-path="url(#clip-2)"><rect x="405" y="124" width="310" height="4" fill="#0d9488"/></g>
  <rect x="425" y="144" width="94" height="24" rx="12" fill="#ccfbf1"/>
  <text x="472" y="160" text-anchor="middle" class="badge-t">02 自动定位</text>
  <text x="530" y="161" class="card-title">隔离运行环境</text>
  <rect x="425" y="186" width="270" height="38" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/>
  <text x="560" y="210" text-anchor="middle" class="badge-t">按自身位置反推当前工程根目录</text>
  <text x="425" y="252" class="body">屏蔽电脑原本安装的 Python 或 GCC</text>
  <text x="425" y="278" class="body">整包拷贝到其他磁盘或电脑立即可用</text>

  <line x1="721" y1="218" x2="753" y2="218" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="761,218 750,212 750,224" fill="#0d9488"/>

  <g filter="url(#card-shadow)">
    <rect x="766" y="124" width="310" height="188" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.25"/>
  </g>
  <g clip-path="url(#clip-3)"><rect x="766" y="124" width="310" height="4" fill="#4f46e5"/></g>
  <rect x="786" y="144" width="96" height="24" rx="12" fill="#e0e7ff"/>
  <text x="834" y="160" text-anchor="middle" class="badge-i">03 调度工具</text>
  <text x="892" y="161" class="card-title">调用 sdk/ 工具</text>
  <rect x="786" y="186" width="130" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="851" y="212" text-anchor="middle" class="chip">Python 3.13</text>
  <rect x="926" y="186" width="130" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="991" y="212" text-anchor="middle" class="chip">CMake + Ninja</text>
  <rect x="786" y="242" width="130" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="851" y="268" text-anchor="middle" class="chip">Arm GCC 13.3</text>
  <rect x="926" y="242" width="130" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="991" y="268" text-anchor="middle" class="chip">OpenOCD</text>

  <g>
    <rect x="44" y="328" width="1032" height="42" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="58" y="337" width="68" height="24" rx="6" fill="#e0f2fe"/>
    <text x="92" y="353.5" text-anchor="middle" class="note-tag">解压提示</text>
    <text x="138" y="354" class="note-txt">建议解压到不含中文和空格的短路径（如 D:\work\DShanMCU-F407），避免部分命令行脚本解析异常。</text>
  </g>
</svg>
