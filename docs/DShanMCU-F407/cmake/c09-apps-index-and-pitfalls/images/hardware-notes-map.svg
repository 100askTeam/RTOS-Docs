<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-labelledby="title desc">
  <title id="title">底板硬件共用与关键电路说明总览</title>
  <desc id="desc">用 5 张卡片展示 M7 光敏 RC 备选测量、M13 编码器四倍频防抖、M12 与核心板 Flash 共用 SPI1、M14 电机与 SRAM 互斥及 I2C1 红外解码要点。</desc>
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5faff"/>
      <stop offset="55%" stop-color="#fbfdff"/>
      <stop offset="100%" stop-color="#f4f8fc"/>
    </linearGradient>
    <pattern id="bp-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1769aa" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="card-shadow" x="-6%" y="-6%" width="112%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f2942" flood-opacity="0.07"/>
    </filter>
    <clipPath id="c1"><rect x="44" y="124" width="328" height="118" rx="14"/></clipPath>
    <clipPath id="c2"><rect x="396" y="124" width="328" height="118" rx="14"/></clipPath>
    <clipPath id="c3"><rect x="748" y="124" width="328" height="118" rx="14"/></clipPath>
    <clipPath id="c4"><rect x="44" y="258" width="504" height="108" rx="14"/></clipPath>
    <clipPath id="c5"><rect x="572" y="258" width="504" height="108" rx="14"/></clipPath>
    <style>
      .eyebrow { font: 700 12px "JetBrains Mono", Consolas, monospace; fill: #1769aa; letter-spacing: 0.7px; }
      .title { font: 700 22px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f2942; }
      .subtitle { font: 500 13.5px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .badge { font: 700 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; }
      .pin { font: 700 12px "JetBrains Mono", Consolas, monospace; fill: #64748b; }
      .body { font: 500 13px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .note-tag { font: 700 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #b45309; }
      .note-txt { font: 500 13px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect width="1120" height="440" fill="url(#bg-grad)"/>
  <rect width="1120" height="440" fill="url(#bp-grid)"/>

  <g>
    <rect x="44" y="24" width="224" height="24" rx="12" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1"/>
    <circle cx="59" cy="36" r="3.5" fill="#0284c7"/>
    <text x="71" y="40" class="eyebrow">18 APPS · HARDWARE NOTES</text>
    <text x="44" y="75" class="title">底板硬件共用与关键电路说明</text>
    <text x="44" y="98" class="subtitle">快速定位阅读 18 个示例源码时最容易疑惑的 5 处电路与驱动处理细节</text>
  </g>

  <!-- Row 1: 3 Cards -->
  <g filter="url(#card-shadow)"><rect x="44" y="124" width="328" height="118" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.25"/></g>
  <g clip-path="url(#c1)"><rect x="44" y="124" width="328" height="4" fill="#d97706"/></g>
  <rect x="62" y="140" width="96" height="22" rx="11" fill="#fef3c7"/>
  <text x="110" y="155" text-anchor="middle" class="badge" fill="#b45309">M7 光敏电阻</text>
  <text x="354" y="155" text-anchor="end" class="pin">PA3 / PC0</text>
  <text x="62" y="186" class="body">上电先检测内部基准 VREFINT，若发现</text>
  <text x="62" y="210" class="body">Vref+ 悬空则自动切到 RC 充放电测光</text>

  <g filter="url(#card-shadow)"><rect x="396" y="124" width="328" height="118" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.25"/></g>
  <g clip-path="url(#c2)"><rect x="396" y="124" width="328" height="4" fill="#1769aa"/></g>
  <rect x="414" y="140" width="110" height="22" rx="11" fill="#e0f2fe"/>
  <text x="469" y="155" text-anchor="middle" class="badge" fill="#0369a1">M13 旋转编码器</text>
  <text x="706" y="155" text-anchor="end" class="pin">PF6 / PF7 / PF8</text>
  <text x="414" y="186" class="body">A/B 相双边沿四倍频查表，跨过完整一格</text>
  <text x="414" y="210" class="body">才更新计数，按键带 15 ms 消抖防误触</text>

  <g filter="url(#card-shadow)"><rect x="748" y="124" width="328" height="118" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.25"/></g>
  <g clip-path="url(#c3)"><rect x="748" y="124" width="328" height="4" fill="#0d9488"/></g>
  <rect x="766" y="140" width="116" height="22" rx="11" fill="#ccfbf1"/>
  <text x="824" y="155" text-anchor="middle" class="badge" fill="#0f766e">M12 SPI1 Flash</text>
  <text x="1058" y="155" text-anchor="end" class="pin">PB14 / PC1</text>
  <text x="766" y="186" class="body">同时把核心板 GD25Q256(PB14) 与底板</text>
  <text x="766" y="210" class="body">W25Q64(PC1) 片选拉高，防总线冲突</text>

  <!-- Row 2: 2 Wide Cards -->
  <g filter="url(#card-shadow)"><rect x="44" y="258" width="504" height="108" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.25"/></g>
  <g clip-path="url(#c4)"><rect x="44" y="258" width="504" height="4" fill="#4f46e5"/></g>
  <rect x="62" y="274" width="142" height="22" rx="11" fill="#e0e7ff"/>
  <text x="133" y="289" text-anchor="middle" class="badge" fill="#4338ca">M14 电机与 SRAM 互斥</text>
  <text x="530" y="289" text-anchor="end" class="pin">PF0~PF2 / PE5</text>
  <text x="62" y="320" class="body">PF0~PF2 与 SRAM 地址线复用，motor_demo 主动不初始化 FSMC；</text>
  <text x="62" y="344" class="body">反转时采用互补 PWM 占空比 (100 - mag) × 10 保持转速对称</text>

  <g filter="url(#card-shadow)"><rect x="572" y="258" width="504" height="108" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.25"/></g>
  <g clip-path="url(#c5)"><rect x="572" y="258" width="504" height="4" fill="#0284c7"/></g>
  <rect x="590" y="274" width="146" height="22" rx="11" fill="#e0f2fe"/>
  <text x="663" y="289" text-anchor="middle" class="badge" fill="#0369a1">I2C1 共用与红外解码</text>
  <text x="1058" y="289" text-anchor="end" class="pin">PB8/9 · PA6/7</text>
  <text x="590" y="320" class="body">M1 OLED (0x3C) 与 M11 MPU6050 (0x68) 通过互斥锁安全共用总线；</text>
  <text x="590" y="344" class="body">红外发射 TIM3 调制 38 kHz 载波，接收端 EXTI6 队列兼容多协议解码</text>

  <g>
    <rect x="44" y="382" width="1032" height="42" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <rect x="58" y="391" width="68" height="24" rx="6" fill="#fef3c7"/>
    <text x="92" y="407.5" text-anchor="middle" class="note-tag">插拔提示</text>
    <text x="138" y="408" class="note-txt">切换实验模块前，注意 PC2（M2/M10）、PA7（M4/M9）与 PA5/1/2（M3/舵机）三组插槽不要同时插着测试。</text>
  </g>
</svg>
