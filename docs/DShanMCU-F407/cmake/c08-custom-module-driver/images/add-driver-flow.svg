<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="384" viewBox="0 0 1120 384" role="img" aria-labelledby="title desc">
  <title id="title">添加自定义外设驱动的 4 个步骤</title>
  <desc id="desc">依次核对可用引脚、在 platform/modules 目录新增 mod_xxx.h/.c、由 CMake 自动扫描加入编译并在应用 main.c 调用测试。</desc>
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5faff"/>
      <stop offset="55%" stop-color="#fbfdff"/>
      <stop offset="100%" stop-color="#f4f8fc"/>
    </linearGradient>
    <pattern id="bp-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1769aa" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="card-shadow" x="-6%" y="-6%" width="112%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f2942" flood-opacity="0.07"/>
    </filter>
    <clipPath id="c1"><rect x="44" y="124" width="232" height="186" rx="14"/></clipPath>
    <clipPath id="c2"><rect x="310" y="124" width="232" height="186" rx="14"/></clipPath>
    <clipPath id="c3"><rect x="576" y="124" width="232" height="186" rx="14"/></clipPath>
    <clipPath id="c4"><rect x="842" y="124" width="234" height="186" rx="14"/></clipPath>
    <style>
      .eyebrow { font: 700 12px "JetBrains Mono", Consolas, monospace; fill: #1769aa; letter-spacing: 0.7px; }
      .title { font: 700 22px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f2942; }
      .subtitle { font: 500 13.5px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .badge { font: 700 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; }
      .mono { font: 700 12.5px "JetBrains Mono", Consolas, monospace; fill: #0f2942; }
      .body { font: 500 13px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .note-tag { font: 700 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0369a1; }
      .note-txt { font: 500 13px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect width="1120" height="384" fill="url(#bg-grad)"/>
  <rect width="1120" height="384" fill="url(#bp-grid)"/>

  <g>
    <rect x="44" y="24" width="212" height="24" rx="12" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1"/>
    <circle cx="59" cy="36" r="3.5" fill="#0284c7"/>
    <text x="71" y="40" class="eyebrow">MODULAR DRIVER GUIDE</text>
    <text x="44" y="75" class="title">添加外设驱动的 4 个步骤</text>
    <text x="44" y="98" class="subtitle">新驱动按照统一位置存放，CMake 会自动纳入构建，不修改原有应用</text>
  </g>

  <g filter="url(#card-shadow)"><rect x="44" y="124" width="232" height="186" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.25"/></g>
  <g clip-path="url(#c1)"><rect x="44" y="124" width="232" height="4" fill="#d97706"/></g>
  <rect x="62" y="144" width="92" height="24" rx="12" fill="#fef3c7"/>
  <text x="108" y="160" text-anchor="middle" class="badge" fill="#b45309">1. 核对引脚</text>
  <rect x="62" y="182" width="196" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="160" y="204" text-anchor="middle" class="mono">避开已有复用脚</text>
  <text x="62" y="244" class="body">检查 PC2、PA7、PF0~2</text>
  <text x="62" y="269" class="body">与 PA5 / PA1 / PA2 占用</text>
  <text x="62" y="294" class="body">及 EXTI 中断线序号</text>

  <line x1="281" y1="217" x2="300" y2="217" stroke="#d97706" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="306,217 297,212 297,222" fill="#d97706"/>

  <g filter="url(#card-shadow)"><rect x="310" y="124" width="232" height="186" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.25"/></g>
  <g clip-path="url(#c2)"><rect x="310" y="124" width="232" height="4" fill="#1769aa"/></g>
  <rect x="328" y="144" width="92" height="24" rx="12" fill="#e0f2fe"/>
  <text x="374" y="160" text-anchor="middle" class="badge" fill="#0369a1">2. 编写驱动</text>
  <rect x="328" y="182" width="196" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="426" y="204" text-anchor="middle" class="mono">platform/modules/</text>
  <text x="328" y="244" class="body">新建 mod_xxx.h 与 .c</text>
  <text x="328" y="269" class="body">直接复用 bsp_i2c1 / spi1</text>
  <text x="328" y="294" class="body">外部中断通过回调注册</text>

  <line x1="547" y1="217" x2="566" y2="217" stroke="#1769aa" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="572,217 563,212 563,222" fill="#1769aa"/>

  <g filter="url(#card-shadow)"><rect x="576" y="124" width="232" height="186" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.25"/></g>
  <g clip-path="url(#c3)"><rect x="576" y="124" width="232" height="4" fill="#0d9488"/></g>
  <rect x="594" y="144" width="92" height="24" rx="12" fill="#ccfbf1"/>
  <text x="640" y="160" text-anchor="middle" class="badge" fill="#0f766e">3. 自动编译</text>
  <rect x="594" y="182" width="196" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="692" y="204" text-anchor="middle" class="mono">无需改 CMakeLists</text>
  <text x="594" y="244" class="body">自动扫描新增的 .c 文件</text>
  <text x="594" y="269" class="body">默认开启全警告严格检查</text>
  <text x="594" y="294" class="body">未用到的驱动不占 Flash</text>

  <line x1="813" y1="217" x2="832" y2="217" stroke="#0d9488" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="838,217 829,212 829,222" fill="#0d9488"/>

  <g filter="url(#card-shadow)"><rect x="842" y="124" width="234" height="186" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.25"/></g>
  <g clip-path="url(#c4)"><rect x="842" y="124" width="234" height="4" fill="#4f46e5"/></g>
  <rect x="860" y="144" width="92" height="24" rx="12" fill="#e0e7ff"/>
  <text x="906" y="160" text-anchor="middle" class="badge" fill="#4338ca">4. 应用调用</text>
  <rect x="860" y="182" width="198" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="959" y="204" text-anchor="middle" class="mono">f407 flash &lt;应用&gt;</text>
  <text x="860" y="244" class="body">在 src/main.c #include</text>
  <text x="860" y="269" class="body">在任务中初始化与读取</text>
  <text x="860" y="294" class="body">通过串口或 OLED 观察</text>

  <g>
    <rect x="44" y="326" width="1032" height="42" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="58" y="335" width="68" height="24" rx="6" fill="#e0f2fe"/>
    <text x="92" y="351.5" text-anchor="middle" class="note-tag">检查提醒</text>
    <text x="138" y="352" class="note-txt">platform/modules/ 启用了 -Wall -Wextra -Werror，出现编译警告时会报错中止，修改后再编译即可。</text>
  </g>
</svg>
