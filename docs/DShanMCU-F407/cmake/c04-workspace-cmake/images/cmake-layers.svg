<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="546" viewBox="0 0 1120 546" role="img" aria-labelledby="title desc">
  <title id="title">工程目录分层与 CMake 构建关系</title>
  <desc id="desc">展示应用层 applications、外设模块层 platform/modules、核心板底座层 platform/bsp 与底层内核驱动层 middlewares/drivers，以及右侧 CMake 装配并输出到 build/&lt;应用名&gt; 的完整关系。</desc>
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5faff"/>
      <stop offset="55%" stop-color="#fbfdff"/>
      <stop offset="100%" stop-color="#f4f8fc"/>
    </linearGradient>
    <pattern id="bp-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1769aa" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="card-shadow" x="-6%" y="-6%" width="112%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f2942" flood-opacity="0.07"/>
    </filter>
    <clipPath id="t1"><rect x="44" y="124" width="656" height="70" rx="12"/></clipPath>
    <clipPath id="t2"><rect x="44" y="216" width="656" height="70" rx="12"/></clipPath>
    <clipPath id="t3"><rect x="44" y="308" width="656" height="70" rx="12"/></clipPath>
    <clipPath id="t4"><rect x="44" y="400" width="656" height="70" rx="12"/></clipPath>
    <clipPath id="tr"><rect x="740" y="124" width="336" height="346" rx="14"/></clipPath>
    <style>
      .eyebrow { font: 700 12px "JetBrains Mono", Consolas, monospace; fill: #1769aa; letter-spacing: 0.7px; }
      .title { font: 700 22px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f2942; }
      .subtitle { font: 500 13.5px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .badge { font: 700 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; }
      .path { font: 700 13px "JetBrains Mono", Consolas, monospace; fill: #0f2942; }
      .desc { font: 500 12.5px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .link-txt { font: 600 11.5px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .panel-title { font: 700 17px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f2942; }
      .box-title { font: 700 13px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f2942; }
      .pill { font: 700 12px "JetBrains Mono", Consolas, monospace; fill: #4338ca; }
      .note-tag { font: 700 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0369a1; }
      .note-txt { font: 500 13px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect width="1120" height="546" fill="url(#bg-grad)"/>
  <rect width="1120" height="546" fill="url(#bp-grid)"/>

  <g>
    <rect x="44" y="24" width="276" height="24" rx="12" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1"/>
    <circle cx="59" cy="36" r="3.5" fill="#0284c7"/>
    <text x="71" y="40" class="eyebrow">WORKSPACE ARCHITECTURE · CMAKE</text>
    <text x="44" y="75" class="title">工程目录分层与 CMake 构建关系</text>
    <text x="44" y="98" class="subtitle">上层应用代码与底层芯片驱动解耦，由 CMake 统一装配并在独立 build 目录输出产物</text>
  </g>

  <!-- Left 4-Tier Stack -->
  <g filter="url(#card-shadow)"><rect x="44" y="124" width="656" height="70" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.25"/></g>
  <g clip-path="url(#t1)"><rect x="44" y="124" width="6" height="70" fill="#1769aa"/></g>
  <rect x="64" y="138" width="76" height="22" rx="11" fill="#e0f2fe"/>
  <text x="102" y="153" text-anchor="middle" class="badge" fill="#0369a1">应用层</text>
  <text x="154" y="154" class="path">applications/&lt;应用名&gt;/</text>
  <text x="64" y="179" class="desc">只放当前应用的业务逻辑，每个目录仅含极简 CMakeLists.txt 与 src/main.c</text>

  <line x1="372" y1="194" x2="372" y2="210" stroke="#64748b" stroke-width="1.8"/>
  <polygon points="372,215 367.5,208 376.5,208" fill="#64748b"/>
  <text x="384" y="209" class="link-txt">调用模块或板级接口</text>

  <g filter="url(#card-shadow)"><rect x="44" y="216" width="656" height="70" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.25"/></g>
  <g clip-path="url(#t2)"><rect x="44" y="216" width="6" height="70" fill="#0d9488"/></g>
  <rect x="64" y="230" width="76" height="22" rx="11" fill="#ccfbf1"/>
  <text x="102" y="245" text-anchor="middle" class="badge" fill="#0f766e">模块层</text>
  <text x="154" y="246" class="path">platform/modules/</text>
  <text x="64" y="271" class="desc">12 组底板传感器与执行器驱动（DHT11、MPU6050、编码器、电机、舵机等）</text>

  <line x1="372" y1="286" x2="372" y2="302" stroke="#64748b" stroke-width="1.8"/>
  <polygon points="372,307 367.5,300 376.5,300" fill="#64748b"/>
  <text x="384" y="301" class="link-txt">调用时钟、延时与总线底座</text>

  <g filter="url(#card-shadow)"><rect x="44" y="308" width="656" height="70" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.25"/></g>
  <g clip-path="url(#t3)"><rect x="44" y="308" width="6" height="70" fill="#0284c7"/></g>
  <rect x="64" y="322" width="76" height="22" rx="11" fill="#e0f2fe"/>
  <text x="102" y="337" text-anchor="middle" class="badge" fill="#0369a1">底座层</text>
  <text x="154" y="338" class="path">platform/bsp · core · ld/</text>
  <text x="64" y="363" class="desc">168 MHz 时钟、TIM4 时基、USART1 串口 printf、FSMC SRAM、OLED 绘图与链接脚本</text>

  <line x1="372" y1="378" x2="372" y2="394" stroke="#64748b" stroke-width="1.8"/>
  <polygon points="372,399 367.5,392 376.5,392" fill="#64748b"/>
  <text x="384" y="393" class="link-txt">基于 RTOS 内核与芯片外设库</text>

  <g filter="url(#card-shadow)"><rect x="44" y="400" width="656" height="70" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.25"/></g>
  <g clip-path="url(#t4)"><rect x="44" y="400" width="6" height="70" fill="#475569"/></g>
  <rect x="64" y="414" width="96" height="22" rx="11" fill="#e2e8f0"/>
  <text x="112" y="429" text-anchor="middle" class="badge" fill="#334155">内核与芯片库</text>
  <text x="174" y="430" class="path">middlewares/ · drivers/</text>
  <text x="64" y="455" class="desc">官方原生 FreeRTOS V11.3.3 内核源码 + ST 官方 STM32F4xx HAL / LL 驱动库</text>

  <!-- Dashed Connectors from Right CMake Panel -->
  <path d="M 740 159 L 708 159" stroke="#4f46e5" stroke-width="1.8" stroke-dasharray="4 3"/>
  <polygon points="702,159 709,155 709,163" fill="#4f46e5"/>
  <path d="M 740 251 L 708 251" stroke="#4f46e5" stroke-width="1.8" stroke-dasharray="4 3"/>
  <polygon points="702,251 709,247 709,255" fill="#4f46e5"/>
  <path d="M 740 343 L 708 343" stroke="#4f46e5" stroke-width="1.8" stroke-dasharray="4 3"/>
  <polygon points="702,343 709,339 709,347" fill="#4f46e5"/>
  <path d="M 740 435 L 708 435" stroke="#4f46e5" stroke-width="1.8" stroke-dasharray="4 3"/>
  <polygon points="702,435 709,431 709,439" fill="#4f46e5"/>

  <!-- Right Panel: CMake Assembly & Build Output -->
  <g filter="url(#card-shadow)"><rect x="740" y="124" width="336" height="346" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.25"/></g>
  <g clip-path="url(#tr)"><rect x="740" y="124" width="336" height="4" fill="#4f46e5"/></g>
  <rect x="760" y="140" width="96" height="22" rx="11" fill="#e0e7ff"/>
  <text x="808" y="155" text-anchor="middle" class="badge" fill="#4338ca">构建与输出</text>
  <text x="870" y="156" class="panel-title">CMake 自动装配</text>

  <rect x="760" y="176" width="296" height="58" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="774" y="198" class="box-title">1. 指定随包编译器与构建器</text>
  <text x="774" y="220" class="path">cmake/arm-none-eabi-gcc.cmake</text>

  <line x1="908" y1="234" x2="908" y2="250" stroke="#4f46e5" stroke-width="2"/>
  <polygon points="908,255 903.5,248 912.5,248" fill="#4f46e5"/>

  <rect x="760" y="256" width="296" height="76" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="774" y="278" class="box-title">2. 装配 4 层库并自动裁剪</text>
  <text x="774" y="299" class="path">cmake/f407_app.cmake</text>
  <text x="774" y="320" class="desc">--gc-sections 自动移除未用到驱动</text>

  <line x1="908" y1="332" x2="908" y2="348" stroke="#4f46e5" stroke-width="2"/>
  <polygon points="908,353 903.5,346 912.5,346" fill="#4f46e5"/>

  <rect x="760" y="354" width="296" height="100" rx="9" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="774" y="376" class="box-title">3. 输出到独立构建目录</text>
  <text x="774" y="398" class="path">build/&lt;应用名&gt;/</text>
  <rect x="774" y="412" width="60" height="28" rx="6" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="804" y="430" text-anchor="middle" class="pill">.elf</text>
  <rect x="842" y="412" width="60" height="28" rx="6" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="872" y="430" text-anchor="middle" class="pill">.hex</text>
  <rect x="910" y="412" width="60" height="28" rx="6" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="940" y="430" text-anchor="middle" class="pill">.bin</text>
  <rect x="978" y="412" width="64" height="28" rx="6" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="1010" y="430" text-anchor="middle" class="pill">.map</text>

  <g>
    <rect x="44" y="486" width="1032" height="44" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="58" y="496" width="68" height="24" rx="6" fill="#e0f2fe"/>
    <text x="92" y="512.5" text-anchor="middle" class="note-tag">独立构建</text>
    <text x="138" y="513" class="note-txt">所有示例共用同一份底层驱动源码，但分别输出到 build/&lt;应用名&gt;，增删功能或修改配置互不影响。</text>
  </g>
</svg>
