<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="394" viewBox="0 0 1120 394" role="img" aria-labelledby="title desc">
  <title id="title">中断与任务协作流程</title>
  <desc id="desc">硬件中断（优先级 5 到 15）调用 FromISR 接口发送信号量或队列消息并触发调度，使阻塞等待的 FreeRTOS 任务立即恢复运行。</desc>
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5faff"/>
      <stop offset="55%" stop-color="#fbfdff"/>
      <stop offset="100%" stop-color="#f4f8fc"/>
    </linearGradient>
    <pattern id="bp-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1769aa" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="card-shadow" x="-6%" y="-6%" width="112%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f2942" flood-opacity="0.07"/>
    </filter>
    <clipPath id="cl"><rect x="44" y="124" width="340" height="196" rx="14"/></clipPath>
    <clipPath id="cm"><rect x="418" y="150" width="284" height="144" rx="14"/></clipPath>
    <clipPath id="cr"><rect x="736" y="124" width="340" height="196" rx="14"/></clipPath>
    <style>
      .eyebrow { font: 700 12px "JetBrains Mono", Consolas, monospace; fill: #1769aa; letter-spacing: 0.7px; }
      .title { font: 700 22px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f2942; }
      .subtitle { font: 500 13.5px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .badge { font: 700 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; }
      .card-title { font: 700 16px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f2942; }
      .mono { font: 700 12.5px "JetBrains Mono", Consolas, monospace; fill: #0f2942; }
      .body { font: 500 13px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .note-tag { font: 700 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0369a1; }
      .note-txt { font: 500 13px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect width="1120" height="394" fill="url(#bg-grad)"/>
  <rect width="1120" height="394" fill="url(#bp-grid)"/>

  <g>
    <rect x="44" y="24" width="268" height="24" rx="12" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1"/>
    <circle cx="59" cy="36" r="3.5" fill="#0284c7"/>
    <text x="71" y="40" class="eyebrow">FREERTOS V11.3.3 · TASK &amp; ISR</text>
    <text x="44" y="75" class="title">中断与任务协作流程（FromISR 规则）</text>
    <text x="44" y="98" class="subtitle">硬件中断只负责通知和递送数据，耗时处理全部交给普通 FreeRTOS 任务完成</text>
  </g>

  <!-- Left Card: ISR -->
  <g filter="url(#card-shadow)"><rect x="44" y="124" width="340" height="196" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.25"/></g>
  <g clip-path="url(#cl)"><rect x="44" y="124" width="340" height="4" fill="#d97706"/></g>
  <rect x="64" y="142" width="106" height="24" rx="12" fill="#fef3c7"/>
  <text x="117" y="158" text-anchor="middle" class="badge" fill="#b45309">硬件中断回调</text>
  <text x="182" y="159" class="card-title">优先级 5～15</text>

  <text x="64" y="192" class="body">1. 按键扫描或外部引脚触发中断</text>
  <rect x="64" y="208" width="300" height="38" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="214" y="232" text-anchor="middle" class="mono">xSemaphoreGiveFromISR(..., &amp;woken)</text>
  <rect x="64" y="256" width="300" height="38" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="214" y="280" text-anchor="middle" class="mono">portYIELD_FROM_ISR(woken)</text>

  <!-- Arrow 1 -->
  <line x1="388" y1="222" x2="408" y2="222" stroke="#0d9488" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="414,222 405,217 405,227" fill="#0d9488"/>

  <!-- Center Card: IPC -->
  <g filter="url(#card-shadow)"><rect x="418" y="150" width="284" height="144" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.25"/></g>
  <g clip-path="url(#cm)"><rect x="418" y="150" width="284" height="4" fill="#0d9488"/></g>
  <rect x="488" y="170" width="144" height="26" rx="13" fill="#ccfbf1"/>
  <text x="560" y="187" text-anchor="middle" class="badge" fill="#0f766e">信号量 / 消息队列</text>
  <text x="560" y="224" text-anchor="middle" class="card-title">安全跨越中断与任务</text>
  <rect x="444" y="242" width="232" height="32" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/>
  <text x="560" y="262.5" text-anchor="middle" class="body">中断只发通知 · 任务读取处理</text>

  <!-- Arrow 2 -->
  <line x1="706" y1="222" x2="726" y2="222" stroke="#1769aa" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="732,222 723,217 723,227" fill="#1769aa"/>

  <!-- Right Card: Task -->
  <g filter="url(#card-shadow)"><rect x="736" y="124" width="340" height="196" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.25"/></g>
  <g clip-path="url(#cr)"><rect x="736" y="124" width="340" height="4" fill="#1769aa"/></g>
  <rect x="756" y="142" width="112" height="24" rx="12" fill="#e0f2fe"/>
  <text x="812" y="158" text-anchor="middle" class="badge" fill="#0369a1">FreeRTOS 任务</text>
  <text x="880" y="159" class="card-title">优先级 1～14</text>

  <text x="756" y="192" class="body">1. 平时在下方函数处阻塞休眠</text>
  <rect x="756" y="208" width="300" height="38" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="906" y="232" text-anchor="middle" class="mono">xSemaphoreTake() / xQueueReceive()</text>
  <rect x="756" y="256" width="300" height="38" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="906" y="280" text-anchor="middle" class="body">收到后立即恢复，刷新 OLED 或串口</text>

  <!-- Bottom Note -->
  <g>
    <rect x="44" y="336" width="1032" height="42" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="58" y="345" width="68" height="24" rx="6" fill="#e0f2fe"/>
    <text x="92" y="361.5" text-anchor="middle" class="note-tag">参数提示</text>
    <text x="138" y="362" class="note-txt">xTaskCreate() 栈参数单位是「4 字节字」，512U = 2048 字节；任务优先级 0～15，推荐写作 tskIDLE_PRIORITY + N。</text>
  </g>
</svg>
