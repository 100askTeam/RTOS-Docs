<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="452" viewBox="0 0 1120 452" role="img" aria-labelledby="title desc">
  <title id="title">light_sensor_demo 双路径亮度自适应机制</title>
  <desc id="desc">上电先检测内部 VREFINT 基准，正常硬件走 ADC1，若 Vref+ 悬空则自动切换 PA3 RC 充放电计时。</desc>
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5faff"/>
      <stop offset="55%" stop-color="#fbfdff"/>
      <stop offset="100%" stop-color="#f4f8fc"/>
    </linearGradient>
    <pattern id="bp-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1769aa" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="card-shadow" x="-6%" y="-6%" width="112%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f2942" flood-opacity="0.07"/>
    </filter>
    <marker id="arrow-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1769aa"/>
    </marker>
    <marker id="arrow-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0d9488"/>
    </marker>
    <marker id="arrow-i" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#4f46e5"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#d97706"/>
    </marker>

    <style>
      .eyebrow { font: 700 12px "JetBrains Mono", Consolas, "Microsoft YaHei", monospace; fill: #1769aa; letter-spacing: 0.7px; }
      .title { font: 700 22px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f2942; }
      .subtitle { font: 500 13.5px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .badge-b { font: 700 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0369a1; }
      .badge-t { font: 700 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f766e; }
      .badge-i { font: 700 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #4338ca; }
      .badge-a { font: 700 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #b45309; }
      .card-title { font: 700 16px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f2942; }
      .card-sm { font: 700 14.5px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f2942; }
      .body { font: 500 12.8px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .body-sm { font: 500 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .mono { font: 700 12.5px "JetBrains Mono", Consolas, monospace; fill: #0f2942; }
      .mono-sm { font: 600 11.8px "JetBrains Mono", Consolas, monospace; fill: #1e293b; }
      .chip { font: 700 12.2px "JetBrains Mono", Inter, "Noto Sans SC", monospace; fill: #1e293b; }
      .note-tag { font: 700 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0369a1; }
      .note-txt { font: 500 12.8px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #334155; }

    </style>
  </defs>

  <rect width="1120" height="452" fill="url(#bg-grad)"/>
  <rect width="1120" height="452" fill="url(#bp-grid)"/>

  <g>
    <rect x="44" y="22" width="330" height="24" rx="12" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1"/>
    <circle cx="59" cy="34" r="3.5" fill="#0284c7"/>
    <text x="71" y="38" class="eyebrow">MODULE DEMO 12 · M7 LIGHT</text>
    <text x="44" y="73" class="title">light_sensor_demo：Vref+ 自动检测与 RC 充放电兜底</text>
    <text x="44" y="96" class="subtitle">兼顾核心板不同硬件批次的自适应驱动 + PC0(EXTI0) 数字阈值边沿立即唤醒任务</text>
  </g>
  <g filter="url(#card-shadow)">
    <rect x="44" y="122" width="290" height="252" rx="14" fill="#ffffff" stroke="#dbe7f3" stroke-width="1.2"/>
    <rect x="44" y="122" width="290" height="6" rx="3" fill="#1769aa"/>
    <rect x="62" y="140" width="94" height="22" rx="11" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1"/>
    <text x="72" y="155" class="badge-b">上电检测</text>
    <text x="62" y="184" class="card-title">ADC_CHANNEL_VREFINT</text>
  </g>
  <rect x="62" y="198" width="254" height="30" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="74" y="217" class="mono-sm">采样 4 次内部带隙基准电压</text>
  <rect x="62" y="238" width="254" height="30" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/>
  <text x="74" y="257" class="mono-sm">读出 100..4079 -&gt; Vref+ 正常</text>
  <rect x="62" y="278" width="254" height="30" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="74" y="297" class="mono-sm">持续读到满量程 -&gt; Vref+ 悬空</text>
  <rect x="62" y="318" width="254" height="30" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="74" y="337" class="mono-sm">+ PC0 EXTI0 数字阈值双边沿中断</text>
  <g filter="url(#card-shadow)">
    <rect x="380" y="122" width="696" height="118" rx="14" fill="#ffffff" stroke="#dbe7f3" stroke-width="1.2"/>
    <rect x="380" y="122" width="696" height="6" rx="3" fill="#0d9488"/>
    <rect x="398" y="140" width="166" height="22" rx="11" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1"/>
    <text x="408" y="155" class="badge-t">分支 A · Vref+ 正常</text>
    <text x="398" y="184" class="card-title">ADC1_IN3(PA3) 12 位采样 + 出厂校准</text>
  </g>
  <rect x="398" y="194" width="660" height="32" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/>
  <text x="410" y="214" class="mono-sm">读取 0x1FFF7A2A 出厂校准值换算真实 VDDA，再采集 PA3 分压计算 mV</text>
  <g filter="url(#card-shadow)">
    <rect x="380" y="256" width="696" height="118" rx="14" fill="#ffffff" stroke="#dbe7f3" stroke-width="1.2"/>
    <rect x="380" y="256" width="696" height="6" rx="3" fill="#b45309"/>
    <rect x="398" y="274" width="192" height="22" rx="11" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
    <text x="408" y="289" class="badge-a">分支 B · Vref+ 悬空兜底</text>
    <text x="398" y="318" class="card-title">PA3 充放电计时 + 二分反解光敏阻值</text>
  </g>
  <rect x="398" y="328" width="660" height="32" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="410" y="348" class="mono-sm">屏蔽 EXTI0 -&gt; 对 PA3 滤波电容测 tf/tr -&gt; 18 步二分搜索反解光敏电阻 RL</text>
  <path d="M 338 205 L 374 181" stroke="#0d9488" stroke-width="2.2" marker-end="url(#arrow-t)"/>
  <path d="M 338 292 L 374 315" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrow-a)"/>
  <g>
    <rect x="44" y="394" width="1032" height="40" rx="10" fill="#ffffff" stroke="#dbe7f3" stroke-width="1.2"/>
    <rect x="56" y="402" width="74" height="24" rx="12" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
    <text x="93" y="418" text-anchor="middle" style="font: 700 12px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #b45309;">协同防抖</text>
    <text x="144" y="419" class="note-txt">进入 RC 脉冲测量前临时清掉 EXTI-&gt;IMR bit0 屏蔽 PC0 中断，测完清标志再恢复，防止充放电脉冲串扰阈值计数。</text>
  </g>
</svg>
