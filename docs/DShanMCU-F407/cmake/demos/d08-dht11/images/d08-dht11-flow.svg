<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="478" viewBox="0 0 1120 478" role="img" aria-labelledby="title desc">
  <title id="title">dht11_demo 单总线微秒时序与临界区采样</title>
  <desc id="desc">在 20 ms 起始低电平期间让出 CPU，微秒级读取 40 位数据时进入临界区并用 DWT 精准采样。</desc>
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5faff"/>
      <stop offset="55%" stop-color="#fbfdff"/>
      <stop offset="100%" stop-color="#f4f8fc"/>
    </linearGradient>
    <pattern id="bp-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1769aa" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="card-shadow" x="-6%" y="-6%" width="112%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f2942" flood-opacity="0.07"/>
    </filter>
    <marker id="arrow-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1769aa"/>
    </marker>
    <marker id="arrow-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0d9488"/>
    </marker>
    <marker id="arrow-i" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#4f46e5"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#d97706"/>
    </marker>

    <style>
      .eyebrow { font: 700 12px "JetBrains Mono", Consolas, "Microsoft YaHei", monospace; fill: #1769aa; letter-spacing: 0.7px; }
      .title { font: 700 22px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f2942; }
      .subtitle { font: 500 13.5px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .badge-b { font: 700 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0369a1; }
      .badge-t { font: 700 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f766e; }
      .badge-i { font: 700 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #4338ca; }
      .badge-a { font: 700 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #b45309; }
      .card-title { font: 700 16px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f2942; }
      .card-sm { font: 700 14.5px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f2942; }
      .body { font: 500 12.8px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .body-sm { font: 500 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .mono { font: 700 12.5px "JetBrains Mono", Consolas, monospace; fill: #0f2942; }
      .mono-sm { font: 600 11.8px "JetBrains Mono", Consolas, monospace; fill: #1e293b; }
      .chip { font: 700 12.2px "JetBrains Mono", Inter, "Noto Sans SC", monospace; fill: #1e293b; }
      .note-tag { font: 700 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0369a1; }
      .note-txt { font: 500 12.8px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #334155; }

    </style>
  </defs>

  <rect width="1120" height="478" fill="url(#bg-grad)"/>
  <rect width="1120" height="478" fill="url(#bp-grid)"/>

  <g>
    <rect x="44" y="22" width="330" height="24" rx="12" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1"/>
    <circle cx="59" cy="34" r="3.5" fill="#0284c7"/>
    <text x="71" y="38" class="eyebrow">MODULE DEMO 08 · M10 DHT11</text>
    <text x="44" y="73" class="title">dht11_demo：PC2 单总线起始波形与 DWT 40 us 判定</text>
    <text x="44" y="96" class="subtitle">慢速阶段用 vTaskDelay 让出调度，微秒阶段用 taskENTER_CRITICAL + DWT-&gt;CYCCNT 防任务切换破坏时序</text>
  </g>
  <g filter="url(#card-shadow)">
    <rect x="44" y="118" width="1032" height="170" rx="14" fill="#ffffff" stroke="#dbe7f3" stroke-width="1.2"/>
    <rect x="44" y="118" width="1032" height="6" rx="3" fill="#1769aa"/>
    <text x="64" y="147" class="card-sm">PC2 单总线通信波形（总长约 24 ms，每 2 s 采集一次）</text>
    <rect x="460" y="130" width="165" height="22" rx="11" fill="#e0f2fe" stroke="#bae6fd"/>
    <text x="542" y="145" text-anchor="middle" class="badge-b">任务延时 (让出CPU)</text>
    <rect x="640" y="130" width="230" height="22" rx="11" fill="#fef3c7" stroke="#fde68a"/>
    <text x="755" y="145" text-anchor="middle" class="badge-a">taskENTER_CRITICAL 临界区</text>
    <!-- Waveform polyline (HIGH y=194, LOW y=234) -->
    <polyline points="68,194 96,194 96,234 250,234 250,194 296,194 296,234 364,234 364,194 432,194 432,234 480,234 480,194 520,194 520,234 584,234 584,194 684,194 684,234 740,234"
              fill="none" stroke="#0f2942" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Sample point 40us -->
    <line x1="636" y1="183" x2="636" y2="240" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4 3"/>
    <text x="636" y="178" text-anchor="middle" style="font:700 11px JetBrains Mono, monospace; fill:#dc2626;">+40us 采样点</text>
    <text x="173" y="256" text-anchor="middle" class="mono-sm">主机拉低 20ms</text>
    <text x="330" y="256" text-anchor="middle" class="mono-sm">ACK 80u低</text>
    <text x="398" y="256" text-anchor="middle" class="mono-sm">80u高</text>
    <text x="490" y="256" text-anchor="middle" class="mono-sm">Bit 0 (27u高)</text>
    <text x="634" y="256" text-anchor="middle" class="mono-sm">Bit 1 (70u高)</text>
    <!-- Right summary card -->
    <rect x="762" y="184" width="294" height="82" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="776" y="206" class="mono-sm">循环 40 位 -&gt; buf[0..4]</text>
    <text x="776" y="228" class="body-sm">校验 buf[4] == sum(buf[0..3])</text>
    <text x="776" y="250" class="body-sm">通过后更新 OLED 温湿度双卡</text>
  </g>
  <g filter="url(#card-shadow)">
    <rect x="44" y="302" width="496" height="112" rx="14" fill="#ffffff" stroke="#dbe7f3" stroke-width="1.2"/>
    <rect x="44" y="302" width="496" height="6" rx="3" fill="#0d9488"/>
    <rect x="62" y="320" width="158" height="22" rx="11" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1"/>
    <text x="72" y="335" class="badge-t">关键技巧 · 采样窗口</text>
    <text x="62" y="364" class="card-title">为什么延迟 40 us 后读引脚就能区分 0/1？</text>
  </g>
  <text x="62" y="384" class="body">Bit 0 高电平约 26-28 us 即跌回低电平，Bit 1 高电平持续约 70 us；</text>
  <text x="62" y="403" class="body">在 +40 us 采样窗口读取：高电平记为 1（并等待拉低），低电平记为 0。</text>
  <g filter="url(#card-shadow)">
    <rect x="580" y="302" width="496" height="112" rx="14" fill="#ffffff" stroke="#dbe7f3" stroke-width="1.2"/>
    <rect x="580" y="302" width="496" height="6" rx="3" fill="#b45309"/>
    <rect x="598" y="320" width="158" height="22" rx="11" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
    <text x="608" y="335" class="badge-a">硬件约束 · 引脚共用</text>
    <text x="598" y="364" class="card-title">M10(DHT11) 与 M2(DS18B20) 共用 PC2</text>
  </g>
  <text x="598" y="384" class="body">两者物理上共用 PC2 单总线，运行时不能同时插在底板上；</text>
  <text x="598" y="403" class="body">若校验失败，请检查是否漏拔 M2 模块并保持至少 2 s 采样间隔。</text>
  <g>
    <rect x="44" y="426" width="1032" height="40" rx="10" fill="#ffffff" stroke="#dbe7f3" stroke-width="1.2"/>
    <rect x="56" y="434" width="100" height="24" rx="12" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1"/>
    <text x="106" y="450" text-anchor="middle" style="font: 700 12px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #0369a1;">DWT 计时</text>
    <text x="170" y="451" class="note-txt">DWT-&gt;CYCCNT 是 Cortex-M4 内核 168 MHz 周期计数器，每微秒精确走 168 个脉冲，不受低优先中断调度干扰。</text>
  </g>
</svg>
