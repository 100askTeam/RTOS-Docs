<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="396" viewBox="0 0 1120 396" role="img" aria-labelledby="title desc">
  <title id="title">blinky 运行流程</title>
  <desc id="desc">main 启动任务后通过 500 ms 周期延时交替翻转 PF9/PF10，并可选同步 OLED 与串口。</desc>
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5faff"/>
      <stop offset="55%" stop-color="#fbfdff"/>
      <stop offset="100%" stop-color="#f4f8fc"/>
    </linearGradient>
    <pattern id="bp-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1769aa" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="card-shadow" x="-6%" y="-6%" width="112%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f2942" flood-opacity="0.07"/>
    </filter>
    <marker id="arrow-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1769aa"/>
    </marker>
    <marker id="arrow-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0d9488"/>
    </marker>
    <marker id="arrow-i" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#4f46e5"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#d97706"/>
    </marker>

    <style>
      .eyebrow { font: 700 12px "JetBrains Mono", Consolas, "Microsoft YaHei", monospace; fill: #1769aa; letter-spacing: 0.7px; }
      .title { font: 700 22px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f2942; }
      .subtitle { font: 500 13.5px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .badge-b { font: 700 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0369a1; }
      .badge-t { font: 700 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f766e; }
      .badge-i { font: 700 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #4338ca; }
      .badge-a { font: 700 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #b45309; }
      .card-title { font: 700 16px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f2942; }
      .card-sm { font: 700 14.5px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f2942; }
      .body { font: 500 12.8px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .body-sm { font: 500 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .mono { font: 700 12.5px "JetBrains Mono", Consolas, monospace; fill: #0f2942; }
      .mono-sm { font: 600 11.8px "JetBrains Mono", Consolas, monospace; fill: #1e293b; }
      .chip { font: 700 12.2px "JetBrains Mono", Inter, "Noto Sans SC", monospace; fill: #1e293b; }
      .note-tag { font: 700 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0369a1; }
      .note-txt { font: 500 12.8px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #334155; }

    </style>
  </defs>

  <rect width="1120" height="396" fill="url(#bg-grad)"/>
  <rect width="1120" height="396" fill="url(#bp-grid)"/>

  <g>
    <rect x="44" y="22" width="330" height="24" rx="12" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1"/>
    <circle cx="59" cy="34" r="3.5" fill="#0284c7"/>
    <text x="71" y="38" class="eyebrow">COREBOARD DEMO 01 · BLINKY</text>
    <text x="44" y="73" class="title">blinky：单任务双灯交替与可选外设降级</text>
    <text x="44" y="96" class="subtitle">核心板开箱最小 FreeRTOS 示例：500 ms 定时节拍驱动 PF9/PF10 与可选 M1 OLED</text>
  </g>
  <g filter="url(#card-shadow)">
    <rect x="44" y="122" width="310" height="202" rx="14" fill="#ffffff" stroke="#dbe7f3" stroke-width="1.2"/>
    <rect x="44" y="122" width="310" height="6" rx="3" fill="#1769aa"/>
    <rect x="62" y="140" width="125" height="22" rx="11" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1"/>
    <text x="72" y="155" class="badge-b">STEP 1 · 入口</text>
    <text x="62" y="184" class="card-title">main() 创建任务并调度</text>
  </g>
  <rect x="62" y="198" width="274" height="30" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="74" y="217" class="mono-sm">board_init() -&gt; UART/LED/KEY</text>
  <rect x="62" y="236" width="274" height="30" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="74" y="255" class="mono-sm">xTaskCreate(blinky_task, 512, +1)</text>
  <rect x="62" y="274" width="274" height="30" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="74" y="293" class="mono-sm">vTaskStartScheduler() 接管 CPU</text>
  <g filter="url(#card-shadow)">
    <rect x="405" y="122" width="310" height="202" rx="14" fill="#ffffff" stroke="#dbe7f3" stroke-width="1.2"/>
    <rect x="405" y="122" width="310" height="6" rx="3" fill="#0d9488"/>
    <rect x="423" y="140" width="125" height="22" rx="11" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1"/>
    <text x="433" y="155" class="badge-t">STEP 2 · 节拍</text>
    <text x="423" y="184" class="card-title">500 ms 交替翻转双灯</text>
  </g>
  <rect x="423" y="198" width="274" height="30" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/>
  <text x="435" y="217" class="mono-sm">state = !state; ++tick;</text>
  <rect x="423" y="236" width="274" height="30" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/>
  <text x="435" y="255" class="mono-sm">PF9=state · PF10=!state</text>
  <rect x="423" y="274" width="274" height="30" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="435" y="293" class="mono-sm">vTaskDelay(500ms) 让出 CPU</text>
  <g filter="url(#card-shadow)">
    <rect x="766" y="122" width="310" height="202" rx="14" fill="#ffffff" stroke="#dbe7f3" stroke-width="1.2"/>
    <rect x="766" y="122" width="310" height="6" rx="3" fill="#4338ca"/>
    <rect x="784" y="140" width="151" height="22" rx="11" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1"/>
    <text x="794" y="155" class="badge-i">STEP 3 · 交互反馈</text>
    <text x="784" y="184" class="card-title">OLED 可选 + 串口节流打印</text>
  </g>
  <rect x="784" y="198" width="274" height="30" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="796" y="217" class="mono-sm">oled_ui_is_ready() ? 刷新仪表盘</text>
  <rect x="784" y="236" width="274" height="30" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="796" y="255" class="mono-sm">未插 M1 屏幕 -&gt; 静默跳过不卡死</text>
  <rect x="784" y="274" width="274" height="30" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="796" y="293" class="mono-sm">(tick % 4 == 0) 每 2s 打印 1 次</text>
  <path d="M 358 223 L 399 223" stroke="#1769aa" stroke-width="2.2" marker-end="url(#arrow-b)"/>
  <path d="M 719 223 L 760 223" stroke="#0d9488" stroke-width="2.2" marker-end="url(#arrow-t)"/>
  <g>
    <rect x="44" y="340" width="1032" height="40" rx="10" fill="#ffffff" stroke="#dbe7f3" stroke-width="1.2"/>
    <rect x="56" y="348" width="74" height="24" rx="12" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1"/>
    <text x="93" y="364" text-anchor="middle" style="font: 700 12px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #0369a1;">极性要点</text>
    <text x="144" y="365" class="note-txt">核心板 LED1(PF9) 与 LED2(PF10) 均为低电平点亮；bsp_led_set() 内部已完成有效电平取反，任务循环通过 vTaskDelay 让出 CPU。</text>
  </g>
</svg>
