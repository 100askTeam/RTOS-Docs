<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="486" viewBox="0 0 1120 486" role="img" aria-labelledby="title desc">
  <title id="title">servo_demo 50 Hz 舵机脉冲宽度与角度映射</title>
  <desc id="desc">TIM2 配置 PSC=83、ARR=19999，使计数器精确 1 us 步进且 20 ms 循环，以脉宽 500~2500 us 对齐 0~180 度。</desc>
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5faff"/>
      <stop offset="55%" stop-color="#fbfdff"/>
      <stop offset="100%" stop-color="#f4f8fc"/>
    </linearGradient>
    <pattern id="bp-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1769aa" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="card-shadow" x="-6%" y="-6%" width="112%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f2942" flood-opacity="0.07"/>
    </filter>
    <marker id="arrow-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1769aa"/>
    </marker>
    <marker id="arrow-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0d9488"/>
    </marker>
    <marker id="arrow-i" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#4f46e5"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#d97706"/>
    </marker>

    <style>
      .eyebrow { font: 700 12px "JetBrains Mono", Consolas, "Microsoft YaHei", monospace; fill: #1769aa; letter-spacing: 0.7px; }
      .title { font: 700 22px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f2942; }
      .subtitle { font: 500 13.5px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .badge-b { font: 700 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0369a1; }
      .badge-t { font: 700 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f766e; }
      .badge-i { font: 700 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #4338ca; }
      .badge-a { font: 700 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #b45309; }
      .card-title { font: 700 16px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f2942; }
      .card-sm { font: 700 14.5px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f2942; }
      .body { font: 500 12.8px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .body-sm { font: 500 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .mono { font: 700 12.5px "JetBrains Mono", Consolas, monospace; fill: #0f2942; }
      .mono-sm { font: 600 11.8px "JetBrains Mono", Consolas, monospace; fill: #1e293b; }
      .chip { font: 700 12.2px "JetBrains Mono", Inter, "Noto Sans SC", monospace; fill: #1e293b; }
      .note-tag { font: 700 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0369a1; }
      .note-txt { font: 500 12.8px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #334155; }

    </style>
  </defs>

  <rect width="1120" height="486" fill="url(#bg-grad)"/>
  <rect width="1120" height="486" fill="url(#bp-grid)"/>

  <g>
    <rect x="44" y="22" width="330" height="24" rx="12" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1"/>
    <circle cx="59" cy="34" r="3.5" fill="#0284c7"/>
    <text x="71" y="38" class="eyebrow">MODULE DEMO 18 · J6-J8 SERVO</text>
    <text x="44" y="73" class="title">servo_demo：50 Hz 周期 PWM 脉宽映射与手动步进</text>
    <text x="44" y="96" class="subtitle">J6(PA5)、J7(PA1)、J8(PA2) 同步输出标准舵机控制脉冲，支持 900 ms 自动扫角与按键逐格校准</text>
  </g>
  <g filter="url(#card-shadow)">
    <rect x="44" y="118" width="1032" height="176" rx="14" fill="#ffffff" stroke="#dbe7f3" stroke-width="1.2"/>
    <rect x="44" y="118" width="1032" height="6" rx="3" fill="#1769aa"/>
    <text x="64" y="147" class="card-sm">TIM2 舵机 50 Hz 周期脉冲宽度映射（1 tick = 1 us，周期 ARR+1 = 20000 us = 20 ms）</text>
    <!-- 0 deg (42px spacing vertically) -->
    <text x="64" y="186" class="mono">  0 deg</text>
    <polyline points="150,192 180,192 180,172 230,172 230,192 520,192" fill="none" stroke="#0d9488" stroke-width="2.4"/>
    <text x="205" y="167" text-anchor="middle" style="font:700 11px JetBrains Mono, monospace; fill:#0d9488;">500 us</text>
    <!-- 90 deg -->
    <text x="64" y="228" class="mono"> 90 deg</text>
    <polyline points="150,234 180,234 180,214 300,214 300,234 520,234" fill="none" stroke="#1769aa" stroke-width="2.4"/>
    <text x="240" y="209" text-anchor="middle" style="font:700 11px JetBrains Mono, monospace; fill:#1769aa;">1500 us (中位)</text>
    <!-- 180 deg -->
    <text x="64" y="270" class="mono">180 deg</text>
    <polyline points="150,276 180,276 180,256 370,256 370,276 520,276" fill="none" stroke="#4f46e5" stroke-width="2.4"/>
    <text x="275" y="251" text-anchor="middle" style="font:700 11px JetBrains Mono, monospace; fill:#4f46e5;">2500 us</text>
    <!-- Right side formula box -->
    <rect x="570" y="174" width="480" height="96" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="590" y="202" class="mono">pulse_us = 500U + (deg * 2000U) / 180U;</text>
    <text x="590" y="228" class="body">TIM2_CH1(PA5/J6) · TIM2_CH2(PA1/J7) · TIM2_CH3(PA2/J8)</text>
    <text x="590" y="252" class="body-sm">周期 20 ms 结束前保持低电平，仅前 0.5~2.5 ms 高电平脉宽决定目标角度</text>
  </g>
  <g filter="url(#card-shadow)">
    <rect x="44" y="308" width="496" height="112" rx="14" fill="#ffffff" stroke="#dbe7f3" stroke-width="1.2"/>
    <rect x="44" y="308" width="496" height="6" rx="3" fill="#1769aa"/>
    <rect x="62" y="326" width="104" height="22" rx="11" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1"/>
    <text x="72" y="341" class="badge-b">步进校准模式</text>
    <text x="62" y="370" class="card-title">上电自动扫角 -&gt; 按键变手动步进</text>
  </g>
  <text x="62" y="390" class="body">k_angles[] 含 0/45/90/135/180 往返 8 档，每 900 ms 步进；</text>
  <text x="62" y="409" class="body">按下 K1 或 KEY0 立刻切为手动单步模式，便于安装摆臂零位。</text>
  <g filter="url(#card-shadow)">
    <rect x="580" y="308" width="496" height="112" rx="14" fill="#ffffff" stroke="#dbe7f3" stroke-width="1.2"/>
    <rect x="580" y="308" width="496" height="6" rx="3" fill="#b45309"/>
    <rect x="598" y="326" width="117" height="22" rx="11" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
    <text x="608" y="341" class="badge-a">硬件互斥与供电</text>
    <text x="598" y="370" class="card-title">与 M3 RGB 共用 TIM2 与引脚</text>
  </g>
  <text x="598" y="390" class="body">M3 与 J6~J8 共用 PA5/PA1/PA2，用舵机前请先拔除 M3；</text>
  <text x="598" y="409" class="body">多个舵机同时带动负载时建议改用外部 5V 单独供电。</text>
  <g>
    <rect x="44" y="434" width="1032" height="40" rx="10" fill="#ffffff" stroke="#dbe7f3" stroke-width="1.2"/>
    <rect x="56" y="442" width="87" height="24" rx="12" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1"/>
    <text x="99" y="458" text-anchor="middle" style="font: 700 12px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #0369a1;">计数器巧用</text>
    <text x="157" y="459" class="note-txt">相比 1 kHz RGB 调光，舵机只是把 mod_servo_init() 里的 ARR 从 999 改成 19999，即得 1 us 分辨率的 50 Hz 信号。</text>
  </g>
</svg>
