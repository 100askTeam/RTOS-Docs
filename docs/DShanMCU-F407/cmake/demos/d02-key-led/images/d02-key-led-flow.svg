<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="412" viewBox="0 0 1120 412" role="img" aria-labelledby="title desc">
  <title id="title">key_led_demo 中断与消抖流程</title>
  <desc id="desc">TIM4 1ms 扫描消除机械抖动，再以二进制信号量唤醒任务更新 LED 与 OLED。</desc>
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5faff"/>
      <stop offset="55%" stop-color="#fbfdff"/>
      <stop offset="100%" stop-color="#f4f8fc"/>
    </linearGradient>
    <pattern id="bp-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1769aa" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="card-shadow" x="-6%" y="-6%" width="112%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f2942" flood-opacity="0.07"/>
    </filter>
    <marker id="arrow-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1769aa"/>
    </marker>
    <marker id="arrow-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0d9488"/>
    </marker>
    <marker id="arrow-i" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#4f46e5"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#d97706"/>
    </marker>

    <style>
      .eyebrow { font: 700 12px "JetBrains Mono", Consolas, "Microsoft YaHei", monospace; fill: #1769aa; letter-spacing: 0.7px; }
      .title { font: 700 22px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f2942; }
      .subtitle { font: 500 13.5px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .badge-b { font: 700 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0369a1; }
      .badge-t { font: 700 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f766e; }
      .badge-i { font: 700 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #4338ca; }
      .badge-a { font: 700 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #b45309; }
      .card-title { font: 700 16px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f2942; }
      .card-sm { font: 700 14.5px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f2942; }
      .body { font: 500 12.8px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .body-sm { font: 500 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .mono { font: 700 12.5px "JetBrains Mono", Consolas, monospace; fill: #0f2942; }
      .mono-sm { font: 600 11.8px "JetBrains Mono", Consolas, monospace; fill: #1e293b; }
      .chip { font: 700 12.2px "JetBrains Mono", Inter, "Noto Sans SC", monospace; fill: #1e293b; }
      .note-tag { font: 700 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0369a1; }
      .note-txt { font: 500 12.8px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #334155; }

    </style>
  </defs>

  <rect width="1120" height="412" fill="url(#bg-grad)"/>
  <rect width="1120" height="412" fill="url(#bp-grid)"/>

  <g>
    <rect x="44" y="22" width="330" height="24" rx="12" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1"/>
    <circle cx="59" cy="34" r="3.5" fill="#0284c7"/>
    <text x="71" y="38" class="eyebrow">COREBOARD DEMO 02 · KEY &amp; LED</text>
    <text x="44" y="73" class="title">key_led_demo：1 ms 定时器积分消抖与事件唤醒</text>
    <text x="44" y="96" class="subtitle">避免在中断里阻塞延时，通过 TIM4 1 kHz 节拍 + 二进制信号量实现低功耗事件驱动</text>
  </g>
  <g filter="url(#card-shadow)">
    <rect x="44" y="122" width="310" height="214" rx="14" fill="#ffffff" stroke="#dbe7f3" stroke-width="1.2"/>
    <rect x="44" y="122" width="310" height="6" rx="3" fill="#b45309"/>
    <rect x="62" y="140" width="119" height="22" rx="11" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
    <text x="72" y="155" class="badge-a">TIM4 1ms 中断</text>
    <text x="62" y="184" class="card-title">积分器消除触点抖动</text>
  </g>
  <rect x="62" y="198" width="274" height="30" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="74" y="217" class="mono-sm">TIM4 ISR -&gt; bsp_key_tick_1ms()</text>
  <rect x="62" y="236" width="274" height="30" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="74" y="255" class="mono-sm">s_integrator[i] 累加至 10 ms</text>
  <rect x="62" y="274" width="274" height="30" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="74" y="293" class="mono-sm">有效边沿 -&gt; xSemaphoreGiveFromISR</text>
  <g filter="url(#card-shadow)">
    <rect x="405" y="122" width="310" height="214" rx="14" fill="#ffffff" stroke="#dbe7f3" stroke-width="1.2"/>
    <rect x="405" y="122" width="310" height="6" rx="3" fill="#1769aa"/>
    <rect x="423" y="140" width="119" height="22" rx="11" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1"/>
    <text x="433" y="155" class="badge-b">FreeRTOS 任务</text>
    <text x="423" y="184" class="card-title">阻塞等待并读走累计次数</text>
  </g>
  <rect x="423" y="198" width="274" height="30" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="435" y="217" class="mono-sm">bsp_key_wait_event(rem_ms) 休眠</text>
  <rect x="423" y="236" width="274" height="30" rx="8" fill="#f0f9ff" stroke="#bae68a" stroke-width="1"/>
  <text x="435" y="255" class="mono-sm">bsp_key_take_presses() 关中断清零</text>
  <rect x="423" y="274" width="274" height="30" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="435" y="293" class="mono-sm">((n &amp; 1) != 0) 奇数次按压才翻转锁存</text>
  <g filter="url(#card-shadow)">
    <rect x="766" y="122" width="310" height="214" rx="14" fill="#ffffff" stroke="#dbe7f3" stroke-width="1.2"/>
    <rect x="766" y="122" width="310" height="6" rx="3" fill="#0d9488"/>
    <rect x="784" y="140" width="94" height="22" rx="11" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1"/>
    <text x="794" y="155" class="badge-t">输出与界面</text>
    <text x="784" y="184" class="card-title">锁存点亮 + 按住即亮</text>
  </g>
  <rect x="784" y="198" width="274" height="30" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/>
  <text x="796" y="217" class="mono-sm">KEY0(PE3)-&gt;LED1 | WKUP(PA0)-&gt;LED2</text>
  <rect x="784" y="236" width="274" height="30" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/>
  <text x="796" y="255" class="mono-sm">K1(PB1, 10K上拉) -&gt; 双灯同步翻转</text>
  <rect x="784" y="274" width="274" height="30" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="796" y="293" class="mono-sm">事件触发或 200ms 周期重绘 OLED</text>
  <path d="M 358 228 L 399 228" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrow-a)"/>
  <path d="M 719 228 L 760 228" stroke="#1769aa" stroke-width="2.2" marker-end="url(#arrow-b)"/>
  <g>
    <rect x="44" y="354" width="1032" height="40" rx="10" fill="#ffffff" stroke="#dbe7f3" stroke-width="1.2"/>
    <rect x="56" y="362" width="74" height="24" rx="12" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
    <text x="93" y="378" text-anchor="middle" style="font: 700 12px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #b45309;">极性差异</text>
    <text x="144" y="379" class="note-txt">核心板 KEY0(PE3) 与 WKUP(PA0) 为按下高电平，底板 K1(PB1) 为 10K 上拉按下低电平；raw_key_active() 在驱动层统一了三种判断。</text>
  </g>
</svg>
