<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="452" viewBox="0 0 1120 452" role="img" aria-labelledby="title desc">
  <title id="title">ir_tx_rx_demo 四任务并发与跨任务通信图谱</title>
  <desc id="desc">展示项目中任务数量最多的示例：4 个任务分别负责收、发、错插嗅探和 OLED UI，用队列、信号量与互斥锁解耦。</desc>
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5faff"/>
      <stop offset="55%" stop-color="#fbfdff"/>
      <stop offset="100%" stop-color="#f4f8fc"/>
    </linearGradient>
    <pattern id="bp-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1769aa" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="card-shadow" x="-6%" y="-6%" width="112%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f2942" flood-opacity="0.07"/>
    </filter>
    <marker id="arrow-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1769aa"/>
    </marker>
    <marker id="arrow-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0d9488"/>
    </marker>
    <marker id="arrow-i" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#4f46e5"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#d97706"/>
    </marker>

    <style>
      .eyebrow { font: 700 12px "JetBrains Mono", Consolas, "Microsoft YaHei", monospace; fill: #1769aa; letter-spacing: 0.7px; }
      .title { font: 700 22px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f2942; }
      .subtitle { font: 500 13.5px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .badge-b { font: 700 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0369a1; }
      .badge-t { font: 700 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f766e; }
      .badge-i { font: 700 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #4338ca; }
      .badge-a { font: 700 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #b45309; }
      .card-title { font: 700 16px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f2942; }
      .card-sm { font: 700 14.5px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f2942; }
      .body { font: 500 12.8px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .body-sm { font: 500 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .mono { font: 700 12.5px "JetBrains Mono", Consolas, monospace; fill: #0f2942; }
      .mono-sm { font: 600 11.8px "JetBrains Mono", Consolas, monospace; fill: #1e293b; }
      .chip { font: 700 12.2px "JetBrains Mono", Inter, "Noto Sans SC", monospace; fill: #1e293b; }
      .note-tag { font: 700 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0369a1; }
      .note-txt { font: 500 12.8px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #334155; }

    </style>
  </defs>

  <rect width="1120" height="452" fill="url(#bg-grad)"/>
  <rect width="1120" height="452" fill="url(#bp-grid)"/>

  <g>
    <rect x="44" y="22" width="330" height="24" rx="12" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1"/>
    <circle cx="59" cy="34" r="3.5" fill="#0284c7"/>
    <text x="71" y="38" class="eyebrow">MODULE DEMO 15 · M4 + M8 IR</text>
    <text x="44" y="73" class="title">ir_tx_rx_demo：4 任务并发、队列解耦与错插嗅探</text>
    <text x="44" y="96" class="subtitle">优先级递减编排：接收解码(+4) -&gt; 38 kHz 发射(+3) -&gt; 错插嗅探(+1) / OLED 界面(+1)</text>
  </g>
  <g filter="url(#card-shadow)">
    <rect x="44" y="122" width="240" height="222" rx="14" fill="#ffffff" stroke="#dbe7f3" stroke-width="1.2"/>
    <rect x="44" y="122" width="240" height="6" rx="3" fill="#4338ca"/>
    <rect x="62" y="140" width="125" height="22" rx="11" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1"/>
    <text x="72" y="155" class="badge-i">prio+4 · 最高</text>
    <text x="62" y="184" class="card-title">ir_rx_task</text>
  </g>
  <rect x="58" y="198" width="212" height="28" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="70" y="216" class="mono-sm">PA6 EXTI6 DWT 量边沿间距</text>
  <rect x="58" y="232" width="212" height="28" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="70" y="250" class="mono-sm">xQueueSendFromISR 入队</text>
  <rect x="58" y="266" width="212" height="28" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="70" y="284" class="mono-sm">兼容 NEC / 三星 / 16-bit</text>
  <rect x="58" y="300" width="212" height="28" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="70" y="318" class="mono-sm">给 s_ui_sem 唤醒刷新</text>
  <g filter="url(#card-shadow)">
    <rect x="308" y="122" width="240" height="222" rx="14" fill="#ffffff" stroke="#dbe7f3" stroke-width="1.2"/>
    <rect x="308" y="122" width="240" height="6" rx="3" fill="#b45309"/>
    <rect x="326" y="140" width="125" height="22" rx="11" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
    <text x="336" y="155" class="badge-a">prio+3 · 次高</text>
    <text x="326" y="184" class="card-title">ir_tx_task</text>
  </g>
  <rect x="322" y="198" width="212" height="28" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="334" y="216" class="mono-sm">TIM3_CH2 输出 38 kHz 载波</text>
  <rect x="322" y="232" width="212" height="28" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="334" y="250" class="mono-sm">默认关闭，由 K1/KEY0 启停</text>
  <rect x="322" y="266" width="212" height="28" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="334" y="284" class="mono-sm">NEC 发送: 9ms+4.5ms+32b</text>
  <rect x="322" y="300" width="212" height="28" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="334" y="318" class="mono-sm">未开启时 PA7 为上拉输入</text>
  <g filter="url(#card-shadow)">
    <rect x="572" y="122" width="240" height="222" rx="14" fill="#ffffff" stroke="#dbe7f3" stroke-width="1.2"/>
    <rect x="572" y="122" width="240" height="6" rx="3" fill="#0d9488"/>
    <rect x="590" y="140" width="125" height="22" rx="11" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1"/>
    <text x="600" y="155" class="badge-t">prio+1 · 诊断</text>
    <text x="590" y="184" class="card-title">sniffer_task</text>
  </g>
  <rect x="586" y="198" width="212" height="28" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/>
  <text x="598" y="216" class="mono-sm">空闲时轮询 PA7/PC5/PC2</text>
  <rect x="586" y="232" width="212" height="28" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/>
  <text x="598" y="250" class="mono-sm">发现其它脚有脉冲但 PA6=0</text>
  <rect x="586" y="266" width="212" height="28" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="598" y="284" class="mono-sm">立即提示 WRONG SOCKET</text>
  <rect x="586" y="300" width="212" height="28" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/>
  <text x="598" y="318" class="mono-sm">帮新手秒定位插错插座</text>
  <g filter="url(#card-shadow)">
    <rect x="836" y="122" width="240" height="222" rx="14" fill="#ffffff" stroke="#dbe7f3" stroke-width="1.2"/>
    <rect x="836" y="122" width="240" height="6" rx="3" fill="#1769aa"/>
    <rect x="854" y="140" width="125" height="22" rx="11" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1"/>
    <text x="864" y="155" class="badge-b">prio+1 · 汇总</text>
    <text x="854" y="184" class="card-title">ui_task</text>
  </g>
  <rect x="850" y="198" width="212" height="28" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="862" y="216" class="mono-sm">s_state_mutex 护共享状态</text>
  <rect x="850" y="232" width="212" height="28" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="862" y="250" class="mono-sm">s_ui_sem 40ms 合并刷屏</text>
  <rect x="850" y="266" width="212" height="28" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="862" y="284" class="mono-sm">检测原始脉冲打印 RAW 脉宽</text>
  <rect x="850" y="300" width="212" height="28" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="862" y="318" class="mono-sm">按键切换 tx_enabled 状态</text>
  <g>
    <rect x="44" y="364" width="1032" height="40" rx="10" fill="#ffffff" stroke="#dbe7f3" stroke-width="1.2"/>
    <rect x="56" y="372" width="126" height="24" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
    <text x="119" y="388" text-anchor="middle" style="font: 700 12px Inter, 'Noto Sans SC', 'Microsoft YaHei', sans-serif; fill: #4338ca;">并发同步课本案例</text>
    <text x="196" y="389" class="note-txt">4 个任务写同 1 份状态结构但零竞争：s_state_mutex 护读写、8 槽队列传递解码帧、s_ui_sem 与 s_tx_sem 负责跨任务即时唤醒。</text>
  </g>
</svg>
