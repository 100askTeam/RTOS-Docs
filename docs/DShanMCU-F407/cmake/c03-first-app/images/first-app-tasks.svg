<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="414" viewBox="0 0 1120 414" role="img" aria-labelledby="title desc">
  <title id="title">my_app 按键调速双任务协作图</title>
  <desc id="desc">展示 main() 启动后 key_task 等待按键唤醒切换 s_fast_mode 标志，blinky_task 按新周期控制 LED1/LED2 闪烁并刷新 OLED。</desc>
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5faff"/>
      <stop offset="55%" stop-color="#fbfdff"/>
      <stop offset="100%" stop-color="#f4f8fc"/>
    </linearGradient>
    <pattern id="bp-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1769aa" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="card-shadow" x="-6%" y="-6%" width="112%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f2942" flood-opacity="0.07"/>
    </filter>
    <clipPath id="cl"><rect x="44" y="124" width="276" height="214" rx="14"/></clipPath>
    <clipPath id="crt"><rect x="392" y="124" width="684" height="90" rx="14"/></clipPath>
    <clipPath id="crb"><rect x="392" y="248" width="684" height="90" rx="14"/></clipPath>
    <style>
      .eyebrow { font: 700 12px "JetBrains Mono", Consolas, monospace; fill: #1769aa; letter-spacing: 0.7px; }
      .title { font: 700 22px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f2942; }
      .subtitle { font: 500 13.5px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .badge { font: 700 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; }
      .mono { font: 700 12.5px "JetBrains Mono", Consolas, monospace; fill: #0f2942; }
      .sub { font: 500 12.5px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .step { font: 600 13px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #1e293b; }
      .note-tag { font: 700 12px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f766e; }
      .note-txt { font: 500 13px Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect width="1120" height="414" fill="url(#bg-grad)"/>
  <rect width="1120" height="414" fill="url(#bp-grid)"/>

  <g>
    <rect x="44" y="24" width="232" height="24" rx="12" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1"/>
    <circle cx="59" cy="36" r="3.5" fill="#0284c7"/>
    <text x="71" y="40" class="eyebrow">FREERTOS DUAL-TASK DEMO</text>
    <text x="44" y="75" class="title">my_app 按键调速双任务协作图</text>
    <text x="44" y="98" class="subtitle">按键检测任务平时休眠不占 CPU，按下按键后立刻切换 LED 闪烁频率</text>
  </g>

  <g filter="url(#card-shadow)"><rect x="44" y="124" width="276" height="214" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.25"/></g>
  <g clip-path="url(#cl)"><rect x="44" y="124" width="276" height="4" fill="#475569"/></g>
  <rect x="64" y="142" width="94" height="24" rx="12" fill="#e2e8f0"/>
  <text x="111" y="158" text-anchor="middle" class="badge" fill="#334155">main() 入口</text>

  <rect x="64" y="180" width="236" height="40" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="78" y="205" class="mono">1. board_init()</text>
  <text x="288" y="205" text-anchor="end" class="sub">初始化硬件</text>

  <rect x="64" y="230" width="236" height="40" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="78" y="255" class="mono">2. xTaskCreate()</text>
  <text x="288" y="255" text-anchor="end" class="sub">建 2 个任务</text>

  <rect x="64" y="280" width="236" height="40" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="78" y="305" class="mono">3. vTaskStartScheduler</text>

  <path d="M 320 231 L 354 231 L 354 169 L 382 169" fill="none" stroke="#0d9488" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="388,169 379,164 379,174" fill="#0d9488"/>
  <path d="M 320 231 L 354 231 L 354 293 L 382 293" fill="none" stroke="#1769aa" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="388,293 379,288 379,298" fill="#1769aa"/>

  <g filter="url(#card-shadow)"><rect x="392" y="124" width="684" height="90" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.25"/></g>
  <g clip-path="url(#crt)"><rect x="392" y="124" width="684" height="4" fill="#0d9488"/></g>
  <rect x="412" y="140" width="142" height="22" rx="11" fill="#ccfbf1"/>
  <text x="483" y="155" text-anchor="middle" class="badge" fill="#0f766e">key_task · 优先级 2</text>
  <text x="1056" y="155" text-anchor="end" class="sub">无按键操作时休眠等待，零 CPU 浪费</text>

  <rect x="412" y="172" width="194" height="30" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="509" y="191.5" text-anchor="middle" class="mono">bsp_key_wait_event(100)</text>
  <line x1="612" y1="187" x2="634" y2="187" stroke="#0d9488" stroke-width="2"/>
  <polygon points="640,187 632,183 632,191" fill="#0d9488"/>
  <rect x="644" y="172" width="186" height="30" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="737" y="191.5" text-anchor="middle" class="step">检测到按下 KEY0 / K1</text>
  <line x1="836" y1="187" x2="858" y2="187" stroke="#0d9488" stroke-width="2"/>
  <polygon points="864,187 856,183 856,191" fill="#0d9488"/>
  <rect x="868" y="172" width="188" height="30" rx="7" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/>
  <text x="962" y="191.5" text-anchor="middle" class="badge" fill="#0f766e">翻转速度标志并串口打印</text>

  <line x1="734" y1="214" x2="734" y2="241" stroke="#4f46e5" stroke-width="2.2" stroke-dasharray="4 3"/>
  <polygon points="734,247 729,238 739,238" fill="#4f46e5"/>
  <rect x="752" y="218" width="268" height="24" rx="12" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="886" y="234" text-anchor="middle" class="badge" fill="#4338ca">共享标志 s_fast_mode (500 ms ↔ 150 ms)</text>

  <g filter="url(#card-shadow)"><rect x="392" y="248" width="684" height="90" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.25"/></g>
  <g clip-path="url(#crb)"><rect x="392" y="248" width="684" height="4" fill="#1769aa"/></g>
  <rect x="412" y="264" width="154" height="22" rx="11" fill="#e0f2fe"/>
  <text x="489" y="279" text-anchor="middle" class="badge" fill="#0369a1">blinky_task · 优先级 1</text>
  <text x="1056" y="279" text-anchor="end" class="sub">按当前速度周期循环交替点亮双灯</text>

  <rect x="412" y="296" width="144" height="30" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="484" y="315.5" text-anchor="middle" class="step">读取 s_fast_mode</text>
  <line x1="560" y1="311" x2="578" y2="311" stroke="#1769aa" stroke-width="2"/>
  <polygon points="584,311 576,307 576,315" fill="#1769aa"/>
  <rect x="588" y="296" width="138" height="30" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="657" y="315.5" text-anchor="middle" class="step">翻转 LED1 / LED2</text>
  <line x1="730" y1="311" x2="748" y2="311" stroke="#1769aa" stroke-width="2"/>
  <polygon points="754,311 746,307 746,315" fill="#1769aa"/>
  <rect x="758" y="296" width="146" height="30" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="831" y="315.5" text-anchor="middle" class="step">刷新 OLED 与串口</text>
  <line x1="908" y1="311" x2="924" y2="311" stroke="#1769aa" stroke-width="2"/>
  <polygon points="930,311 922,307 922,315" fill="#1769aa"/>
  <rect x="934" y="296" width="122" height="30" rx="7" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="995" y="315.5" text-anchor="middle" class="mono">vTaskDelay()</text>

  <g>
    <rect x="44" y="354" width="1032" height="44" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="58" y="364" width="68" height="24" rx="6" fill="#ccfbf1"/>
    <text x="92" y="380.5" text-anchor="middle" class="note-tag">新手要点</text>
    <text x="138" y="381" class="note-txt">xTaskCreate() 栈深度单位是「字（4 字节）」，写 512U 表示 2048 字节；带 printf 的任务建议至少设 512U。</text>
  </g>
</svg>
